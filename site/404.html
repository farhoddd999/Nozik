<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sahifa topilmadi · Nozik uchun</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,700;1,500&family=Manrope:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg1:#fff7f4;--bg2:#ffd9e5;--ink:#4b1d33;--hd:#8a2346;--goldt:#7d5a1d;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg1:#1c0a14;--bg2:#40142b;--ink:#ffeef3;--hd:#ffb3c8;--goldt:#e7c27a;color-scheme:dark}}
html,body{height:100%}
body{margin:0;display:grid;place-items:center;padding:24px;box-sizing:border-box;text-align:center;font:16px/1.6 Manrope,system-ui,sans-serif;color:var(--ink);background:radial-gradient(120% 90% at 50% 0%,var(--bg2),var(--bg1) 72%) var(--bg1)}
img{width:76px;height:76px;animation:b 3s ease-in-out infinite}
@keyframes b{50%{transform:translateY(-6px) rotate(-6deg)}}
p.t{font:italic 500 20px 'Cormorant Garamond',Georgia,serif;color:var(--goldt);margin:18px 0 0}
h1{font:700 clamp(40px,9vw,64px)/1.05 'Cormorant Garamond',Georgia,serif;color:var(--hd);margin:.15em 0 .3em;text-wrap:balance}
a{display:inline-block;margin-top:14px;font:600 16px Manrope,sans-serif;text-decoration:none;color:#fff;border-radius:99px;padding:14px 28px;background:linear-gradient(135deg,#f283a6,#c43d6a);box-shadow:0 8px 24px rgba(196,61,106,.35)}
a:focus-visible{outline:3px solid #d95f85;outline-offset:3px}
@media(prefers-reduced-motion:reduce){img{animation:none}}
</style>
</head>
<body>
<main>
<img src="/favicon.svg" alt="">
<p class="t">Bu yoʻl hech qayerga olib bormaydi</p>
<h1>Sahifa topilmadi</h1>
<p>Lekin sen uchun yasalgan dunyo shu yerda.</p>
<a href="/">Bosh sahifaga qaytish</a>
</main>
</body>
</html>
