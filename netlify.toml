[build]
  publish = "site"
  # The whole site is locked by netlify/edge-functions/lock.js (code: SITE_PIN, default 5255).
  edge_functions = "netlify/edge-functions"
  # Fill in the site's own address for the link-preview tags (Netlify sets $URL).
  command = 'sed -i "s#__SITE_URL__#${URL}#g" site/index.html site/lock.html'

# Save credits: only the main branch is built; branch and preview builds are skipped.
[context.branch-deploy]
  ignore = "exit 0"
[context.deploy-preview]
  ignore = "exit 0"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Keep the site out of search engines: only people with the link can find it.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet, noimageindex"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

[[headers]]
  for = "/song.m4a"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
